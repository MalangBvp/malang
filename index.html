<body>
    <div data-include="/src/components/nav.html"></div>

        id="content"></iframe>
    <script src="src/scripts/common.js"></script>

    <script src="src/scripts/access.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD20pmHMSjDirK1CFEz1EIrUJWwqbVLev4",
            authDomain: "malang-auth.firebaseapp.com",
            projectId: "malang-auth",
            storageBucket: "malang-auth.firebasestorage.app",
            messagingSenderId: "522245850115",
            appId: "1:522245850115:web:f8a69e1e021222fa997a36",
            measurementId: "G-GHFQ1YG8WZ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Membership is checked by the upload service (src/scripts/access.js),
        // which only answers about the person signed in.
        let authSeq = 0;

        // Update navbar profile picture. The navbar is loaded after this
        // script runs, so wait a little for it if needed.
        function paintNavbar(photoURL, tries = 25) {
            const profilePic = document.getElementById("profilePic");
            if (!profilePic) {
                if (tries > 0) setTimeout(() => paintNavbar(photoURL, tries - 1), 200);
                return;
            }
            profilePic.src = photoURL || "/resrc/images/icons/user.png";
            profilePic.classList.toggle("profile-pic", !!photoURL);
        }

        async function updateNavbar(user) {
            const seq = ++authSeq;
            let access;
            try {
                access = await malangAccess(user);
            } catch {
                toggleRestricted(); // could not check right now: keep what is shown
                return;
            }
            if (seq !== authSeq) return; // a newer sign-in state arrived meanwhile

            if (user && access.member) {
                paintNavbar(user.photoURL || "/resrc/images/icons/user.png");
                localStorage.setItem("loggedIn", "true");
            } else {
                paintNavbar("");
                localStorage.setItem("loggedIn", "false");
            }
            toggleRestricted();
        }

        // Keep navbar always synced
        onAuthStateChanged(auth, updateNavbar);

        // Expose auth to iframes
        window.firebaseAuth = auth;

        const iframe = document.querySelector("#content");
        iframe.addEventListener("wheel", (e) => {
            iframe.contentWindow.dispatchEvent(new WheelEvent("wheel", e));
        });
    </script>
    <script src="/src/scripts/search.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
</body>
