<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Malang — Recruitment 2026</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,500&family=Bricolage+Grotesque:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #07050f;
            --paper: #f5efe3;
            --text-dim: #c7c0da;
            --gold: #f3c14b;
            --red: #ff6b5b;
            --teal: #2de0ca;
            --purple: #8b5cf6;

            --font-display: 'Fraunces', serif;
            --font-body: 'Bricolage Grotesque', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background: var(--bg);
            color: var(--paper);
            font-family: var(--font-body);
            overflow: hidden;
        }

        #starfield {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: -3;
        }

        .nebula {
            position: fixed;
            width: 65vmax;
            height: 65vmax;
            border-radius: 50%;
            filter: blur(100px);
            opacity: .22;
            mix-blend-mode: screen;
            z-index: -2;
            animation: drift 20s ease-in-out infinite alternate;
        }

        .neb1 {
            background: var(--red);
            top: -25%;
            left: -20%;
        }

        .neb2 {
            background: var(--teal);
            bottom: -30%;
            right: -20%;
            animation-delay: -7s;
        }

        .neb3 {
            background: var(--purple);
            top: 30%;
            right: 10%;
            width: 45vmax;
            height: 45vmax;
            animation-delay: -12s;
        }

        @keyframes drift {
            from {
                transform: translate(0, 0) scale(1);
            }

            to {
                transform: translate(4%, 6%) scale(1.15);
            }
        }

        .page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px;
        }

        .content {
            width: 100%;
            max-width: 720px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        .logo {
            width: min(180px, 45vw);
            filter: drop-shadow(0 10px 30px rgba(0, 0, 0, .45));
            animation: logoFloat 4s ease-in-out infinite;
        }

        @keyframes logoFloat {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        .eyebrow {
            font-family: var(--font-mono);
            font-size: .75rem;
            letter-spacing: .25em;
            color: var(--gold);
            text-transform: uppercase;
        }

        h1 {
            font-family: var(--font-display);
            font-style: italic;
            font-weight: 500;
            font-size: clamp(2.8rem, 8vw, 5.5rem);
            line-height: 1;
        }

        .gradient {
            background: linear-gradient(
                120deg,
                var(--red),
                var(--gold),
                var(--teal),
                var(--purple)
            );
            background-size: 250% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: gradientMove 5s linear infinite;
        }

        @keyframes gradientMove {
            to {
                background-position: 250% center;
            }
        }

        .message {
            max-width: 560px;
            color: var(--text-dim);
            font-size: 1rem;
            line-height: 1.7;
        }

        .divider {
            width: 100px;
            height: 2px;
            background: linear-gradient(
                90deg,
                var(--red),
                var(--gold),
                var(--teal)
            );
            margin: 8px 0;
        }
        @media (max-width: 600px) {
            .content {
                gap: 20px;
            }

            .logo {
                width: 140px;
            }

            .message {
                font-size: .9rem;
            }
        }
    </style>
</head>

<body>

    <canvas id="starfield"></canvas>

    <div class="nebula neb1"></div>
    <div class="nebula neb2"></div>
    <div class="nebula neb3"></div>

    <main class="page">
        <div class="content">

            <img
                src="assets/logo-emblem.png"
                alt="Malang"
                class="logo"
                onerror="this.src='assets/logo.png'"
            >

            <p class="eyebrow">
                MALANG — FINE ARTS & PHOTOGRAPHY CLUB
            </p>

            <h1>
                Recruitments are<br>
                <span class="gradient">closed.</span>
            </h1>

            <div class="divider"></div>

            <p class="message">
                Thank you to everyone who showed interest in joining Malang.
                The recruitment process for 2026 has now concluded.
                We truly appreciate your enthusiasm and participation.
            </p>

        </div>
    </main>

    <script>
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        resize();
        window.addEventListener('resize', resize);

        const stars = Array.from({ length: 180 }, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            r: Math.random() * 1.3 + 0.3,
            phase: Math.random() * Math.PI * 2,
            speed: 0.4 + Math.random() * 0.8
        }));

        function animate(time) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            stars.forEach(star => {
                const twinkle =
                    0.5 +
                    0.5 *
                    Math.sin(
                        (time / 1000) * star.speed +
                        star.phase
                    );

                ctx.globalAlpha = 0.2 + twinkle * 0.7;
                ctx.fillStyle = '#f5efe3';

                ctx.beginPath();
                ctx.arc(
                    star.x,
                    star.y,
                    star.r,
                    0,
                    Math.PI * 2
                );
                ctx.fill();
            });

            ctx.globalAlpha = 1;

            requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);
    </script>

</body>
</html>
