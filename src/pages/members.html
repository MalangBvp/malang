<head>
    <title>Malang | Associates</title>
    <link rel="stylesheet" href="../styles/common.css">
    <script type="module" src="https://cdn.jsdelivr.net/npm/ldrs/dist/auto/ring2.js"></script>
    <style>
        h2 {
            text-align: center;
        }

        .styled-table {
            width: 100%;
            border-collapse: collapse;
            border-spacing: 0;
            border-radius: 7px;
            overflow: hidden;
            text-align: center;
            margin-bottom: 10px;
        }

        .styled-table th,
        .styled-table td {
            padding: 5px;
            border: 1px solid #383838;
            text-align: left;
            white-space: nowrap;
        }

        .styled-table th {
            background: #1b1b1b;
        }

        .styled-table tr:nth-child(even) {
            background: #0f0f0f;
        }

        .styled-table tr:hover {
            background: rgb(25, 21, 0);
            color: rgb(255, 214, 0);
        }

        .table-wrapper {
            overflow-x: auto;
            width: calc(100vw - 20px);
            border-radius: 7px;
            margin: 10px;
        }

        #csv-table {
            width: 100%;
        }
    </style>
</head>

<body>
    <section>
        <div id="loader">
            <l-ring-2 size="25" stroke="2" stroke-length="0.25" bg-opacity="0.1" speed="0.8" color="white"></l-ring-2>
        </div>
        <h2>Malang Associates</h2>
        <div class="table-wrapper">
            <table id="csv-table" class="styled-table" style="margin: 30px auto;"></table>
        </div>
    </section>
</body>

<script>
    const columnsToShow = [
        { key: "name", label: "Name" },
        { key: "position", label: "Position" },
        { key: "year", label: "Year" },
        { key: "branch", label: "Branch" },
        { key: "division", label: "Division" }
    ];

    fetch("../../resrc/data/members.json")
        .then(res => {
            if (!res.ok) throw new Error("Failed to load members data");
            return res.json();
        })
        .then(data => {
            const table = document.getElementById("csv-table");

            let thead =
                "<thead><tr><th>Sr. No.</th>" +
                columnsToShow.map(c => `<th>${c.label}</th>`).join("") +
                "</tr></thead>";

            let tbody = "<tbody>" + data
                .map((row, index) =>
                    "<tr>" +
                    `<td>${index + 1}</td>` +
                    columnsToShow.map(c => `<td>${row[c.key] !== undefined && row[c.key] !== null ? row[c.key] : ""}</td>`).join("") +
                    "</tr>"
                )
                .join("") + "</tbody>";

            table.innerHTML = thead + tbody;
            const loader = document.getElementById("loader");
            if (loader) loader.style.display = "none";
        })
        .catch(err => {
            console.error("Error loading members:", err);
            const loader = document.getElementById("loader");
            if (loader) loader.style.display = "none";
        });
</script>
